<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probar APIS Rest</title>
    <style>
    article {
    border: 1px solid #ccc;
    padding: 1rem;
    margin-bottom: 1rem;
    }

    img {
    height: auto;
    width: 320px;
    max-width: 100%;
    }
</style>
<script type="module">
fetch('/movies')
    .then(res => res.json())
    .then(movies => {
    const html = movies.map(movie => `
        <article data-id="${movie.id}">
        <img>${movie.poster}</img>
        <h2>${movie.title}</h2>
        <button>Eliminar</button>
        </article>
    `).join('')

    document.querySelector('main').innerHTML = html
    })

document.addEventListener('click', e => {
    if (e.target.matches('button')) {
    const article = e.target.closest('article')
    const id = article.dataset.id

    fetch(`/movies/${id}`, {
        method: 'DELETE'
    })
        .then(res => res.json())
        .then(res => {
        if (res.ok) {
            article.remove()
        }
        })
    }
})
</script>
</head>
<body>
    <main>
        
    </main>
</body>
</html>
